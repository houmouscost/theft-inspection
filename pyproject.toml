[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theft-inspection"
version = "0.1.0"
description = "Inspection policies with ML advice against adaptive electricity thieves (Stackelberg evaluation on SGCC)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11",
  "scikit-learn>=1.4", "matplotlib>=3.8", "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
